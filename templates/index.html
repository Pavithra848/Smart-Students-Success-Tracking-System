<!DOCTYPE html> 
 
<html lang="en"> 
 
<head> 
 
    <meta charset="UTF-8"> 
 
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0"> 
 
    <title>St. Antony's College</title> 
 
    <style> 
 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        } 
 
        html, 
        body { 
 
            width: 100%; 
            height: 100%; 
 
            overflow: hidden; 
 
            font-family: Arial, sans-serif; 
        } 
 
 
        /* ========================================= 
           FULL SCREEN PAGE 
        ========================================= */ 
 
        .page { 
 
            position: relative; 
 
            width: 100vw; 
            height: 100vh; 
 
            overflow: hidden; 
 
            display: flex; 
 
            justify-content: center; 
 
            align-items: center; 
        } 
 
 
        /* ========================================= 
           COLLEGE IMAGE 
        ========================================= */ 
 
        .college-image { 
 
            position: absolute; 
 
            top: 0; 
            left: 0; 
 
            width: 100%; 
            height: 100%; 
 
            object-fit: cover; 
 
            object-position: center center; 
 
            display: block; 
 
            z-index: 1; 
 
            filter: 
                brightness(1.03) 
                contrast(1.12) 
                saturate(1.08); 
        } 
 
 
        /* ========================================= 
           CONTENT 
        ========================================= */ 
 
        .content { 
 
            position: relative; 
 
            z-index: 2; 
 
            width: 100%; 
            height: 100%; 
 
            display: flex; 
 
            align-items: center; 
 
            justify-content: flex-end; 
 
            flex-direction: column; 
 
            padding-bottom: 60px; 
        } 
 
 
        /* ========================================= 
           LOGIN BUTTON 
        ========================================= */ 
 
        .login-btn { 
 
            width: 280px; 
 
            height: 68px; 
 
            display: flex; 
 
            align-items: center; 
 
            justify-content: center; 
 
            background: #ffffff; 
 
            color: #06428f; 
 
            text-decoration: none; 
 
            font-size: 21px; 
 
            font-weight: bold; 
 
            border-radius: 15px; 
 
            border: none; 
 
            box-shadow: 
                0 8px 25px 
                rgba(0, 0, 0, 0.30); 
 
            transition: all 0.3s ease; 
        } 
 
 
        .login-btn:hover { 
 
            background: #06428f; 
 
            color: #ffffff; 
 
            transform: translateY(-3px); 
 
            box-shadow: 
                0 12px 30px 
                rgba(0, 0, 0, 0.40); 
        } 
 
 
        .login-btn:active { 
 
            transform: translateY(0); 
        } 
 
 
        /* ========================================= 
           TABLET 
        ========================================= */ 
 
        @media (max-width: 768px) { 
 
            .content { 
 
                padding-bottom: 45px; 
            } 
 
 
            .login-btn { 
 
                width: 235px; 
 
                height: 60px; 
 
                font-size: 19px; 
            } 
        } 
 
 
        /* ========================================= 
           MOBILE 
        ========================================= */ 
 
        @media (max-width: 480px) { 
 
            .content { 
 
                padding-bottom: 30px; 
            } 
 
 
            .login-btn { 
 
                width: 200px; 
 
                height: 54px; 
 
                font-size: 17px; 
 
                border-radius: 12px; 
            } 
        } 


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 360px) {

            .content {

                padding-bottom: 22px;
            }

            .login-btn {

                width: 180px;

                height: 50px;

                font-size: 16px;

                border-radius: 11px;
            }
        }


        /* =========================================
           VERY SMALL MOBILE
        ========================================= */

        @media (max-width: 320px) {

            .content {

                padding-bottom: 18px;
            }

            .login-btn {

                width: 165px;

                height: 48px;

                font-size: 15px;

                border-radius: 10px;
            }
        }
 
    </style> 
 
</head> 
 
 
<body> 
 
 
    <!-- ========================================= 
         FULL SCREEN PAGE 
    ========================================= --> 
 
    <div class="page"> 
 
 
        <!-- ===================================== 
             COLLEGE IMAGE 
        ====================================== --> 
 
        <img 
            src="{{ url_for('static', filename='image/college.jpeg') }}" 
            class="college-image" 
            alt="College Building"> 
 
 
        <!-- ===================================== 
             LOGIN BUTTON 
        ====================================== --> 
 
        <div class="content"> 
 
            <a 
                href="{{ url_for('login') }}" 
                class="login-btn"> 
 
                Login → 
 
            </a> 
 
        </div> 
 
 
    </div> 
 
 
</body> 
 
</html>
