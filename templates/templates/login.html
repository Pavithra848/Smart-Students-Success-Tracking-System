<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Department of BCA & IT - CS</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            overflow: hidden;
        }


        /* =========================================
           FULL SCREEN LOGIN PAGE
        ========================================= */

        .login-page {
            width: 100vw;
            height: 100vh;

            display: flex;

            background: #ffffff;
        }


        /* =========================================
           LEFT IMAGE
        ========================================= */

        .left-side {
            width: 50%;
            height: 100vh;

            overflow: hidden;

            background: #eef6ff;

            position: relative;
        }


        .left-image {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            display: block;
        }


        /* =========================================
           RIGHT LOGIN SIDE
        ========================================= */

        .right-side {
            width: 50%;
            height: 100vh;

            background: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 70px;

            position: relative;

            overflow: hidden;
        }


        /* =========================================
           DECORATION
        ========================================= */

        .circle-top {
            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: #e8f2ff;

            top: -100px;
            right: -80px;
        }


        .circle-bottom {
            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background: #edf6ff;

            bottom: -140px;
            right: -90px;
        }


        .dots {
            position: absolute;

            width: 90px;
            height: 70px;

            right: 35px;
            top: 25px;

            background-image:
                radial-gradient(
                    #3b82f6 2px,
                    transparent 2px
                );

            background-size: 18px 18px;

            opacity: 0.75;
        }


        /* =========================================
           LOGIN CONTENT
        ========================================= */

        .login-box {
            width: 100%;
            max-width: 620px;

            position: relative;
            z-index: 5;
        }


        /* =========================================
           GRADUATION ICON
        ========================================= */

        .cap-icon {
            text-align: center;

            margin-bottom: 12px;
        }


        .cap-icon span {
            font-size: 58px;

            line-height: 1;
        }


        /* =========================================
           DEPARTMENT
        ========================================= */

        .department-name {
            text-align: center;

            color: #124c96;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 38px;

            font-weight: 900;

            line-height: 1.2;

            margin-bottom: 10px;
        }


        .department-subtitle {
            text-align: center;

            color: #64748b;

            font-size: 16px;

            margin-bottom: 30px;
        }


        /* =========================================
           LOGIN TITLE
        ========================================= */

        .login-title {
            text-align: center;

            color: #102a56;

            font-size: 42px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        .login-description {
            text-align: center;

            color: #64748b;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            background: #fff1f2;

            color: #dc2626;

            border: 1px solid #fecdd3;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #1e293b;

            font-size: 16px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        /* =========================================
           INPUT WRAPPER
        ========================================= */

        .input-wrapper {
            position: relative;

            width: 100%;
        }


        .input-icon {
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 22px;

            z-index: 2;
        }


        .form-group input {
            width: 100%;

            height: 60px;

            padding:
                0 55px;

            border: 2px solid #dbeafe;

            border-radius: 12px;

            background: #ffffff;

            color: #1e293b;

            font-size: 17px;

            outline: none;

            transition: 0.25s;

            box-shadow:
                0 2px 8px rgba(37, 99, 235, 0.05);
        }


        .form-group input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 4px rgba(59, 130, 246, 0.10);
        }


        .form-group input::placeholder {
            color: #94a3b8;
        }


        /* =========================================
           PASSWORD EYE
        ========================================= */

        .password-eye {
            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 20px;

            padding: 5px;

            color: #64748b;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-submit {
            width: 100%;

            height: 62px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: #ffffff;

            font-size: 19px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 22px
                rgba(37, 99, 235, 0.25);
        }


        .login-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 28px
                rgba(37, 99, 235, 0.35);
        }


        .login-submit:active {
            transform: translateY(0);
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 900px) {

            body {
                overflow: auto;
            }

            .login-page {
                min-height: 100vh;

                height: auto;

                flex-direction: column;
            }

            .left-side {
                width: 100%;

                height: 320px;
            }

            .right-side {
                width: 100%;

                height: auto;

                min-height: 650px;

                padding: 45px 35px;
            }

            .department-name {
                font-size: 34px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 550px) {

            .left-side {
                height: 230px;
            }

            .right-side {
                padding: 35px 22px;
            }

            .cap-icon span {
                font-size: 48px;
            }

            .department-name {
                font-size: 27px;
            }

            .department-subtitle {
                font-size: 14px;
            }

            .login-title {
                font-size: 34px;
            }

            .login-description {
                font-size: 14px;
            }

            .form-group input {
                height: 56px;

                font-size: 15px;
            }

            .login-submit {
                height: 56px;

                font-size: 17px;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================= */

        @media (max-width: 360px) {

            .left-side {
                height: 190px;
            }

            .right-side {
                padding: 28px 16px;
            }

            .cap-icon {
                margin-bottom: 8px;
            }

            .cap-icon span {
                font-size: 42px;
            }

            .department-name {
                font-size: 23px;
            }

            .department-subtitle {
                font-size: 13px;

                margin-bottom: 22px;
            }

            .login-title {
                font-size: 30px;
            }

            .login-description {
                font-size: 13px;

                margin-bottom: 22px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group label {
                font-size: 14px;
            }

            .form-group input {
                height: 52px;

                font-size: 14px;

                padding: 0 50px;
            }

            .input-icon {
                left: 15px;

                font-size: 19px;
            }

            .password-eye {
                right: 13px;

                font-size: 18px;
            }

            .login-submit {
                height: 52px;

                font-size: 16px;
            }

        }


        /* =========================================
           VERY SMALL MOBILE
        ========================================= */

        @media (max-width: 320px) {

            .left-side {
                height: 170px;
            }

            .right-side {
                padding: 24px 13px;
            }

            .cap-icon span {
                font-size: 38px;
            }

            .department-name {
                font-size: 21px;
            }

            .department-subtitle {
                font-size: 12px;

                margin-bottom: 18px;
            }

            .login-title {
                font-size: 27px;
            }

            .login-description {
                font-size: 12px;
            }

            .form-group input {
                height: 50px;

                font-size: 13px;
            }

            .login-submit {
                height: 50px;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         MAIN PAGE
    ========================================= -->

    <div class="login-page">


        <!-- =====================================
             LEFT SIDE IMAGE
        ====================================== -->

        <div class="left-side">

            <img
                src="{{ url_for('static', filename='image/cs-left.png') }}"
                class="left-image"
                alt="Computer Science">

        </div>


        <!-- =====================================
             RIGHT SIDE
        ====================================== -->

        <div class="right-side">


            <div class="circle-top"></div>

            <div class="circle-bottom"></div>

            <div class="dots"></div>


            <!-- LOGIN BOX -->

            <div class="login-box">


                <!-- GRADUATION ICON -->

                <div class="cap-icon">

                    <span>🎓</span>

                </div>


                <!-- DEPARTMENT -->

                <div class="department-name">

                    Department of BCA &amp; IT<br>

                    - CS

                </div>


                <div class="department-subtitle">

                    Computer Science Department

                </div>


                <!-- LOGIN -->

                <div class="login-title">

                    Login

                </div>


                <p class="login-description">

                    Enter your username and password
                    to access the system.

                </p>


                <!-- ERROR MESSAGE -->

                {% if error %}

                    <div class="error">

                        {{ error }}

                    </div>

                {% endif %}


                <!-- LOGIN FORM -->

                <form
                    method="POST"
                    action="{{ url_for('login') }}">


                    <!-- USERNAME -->

                    <div class="form-group">

                        <label for="username">

                            Username

                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">

                                👤

                            </span>


                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter username"
                                autocomplete="username"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">

                            Password

                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">

                                🔒

                            </span>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required>


                            <button
                                type="button"
                                class="password-eye"
                                onclick="togglePassword()">

                                👁

                            </button>

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-submit">

                        Login to Dashboard →

                    </button>


                </form>


            </div>


        </div>


    </div>


    <!-- =========================================
         PASSWORD SCRIPT
    ========================================= -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.querySelector(".password-eye");


            if (password.type === "password") {

                password.type = "text";

                eye.textContent = "🙈";

            } else {

                password.type = "password";

                eye.textContent = "👁";

            }

        }

    </script>


</body>

</html>
